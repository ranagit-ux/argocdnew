apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ranagit-ux/argocdnew.git
    targetRevision: main
    path: environments/prod/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-namespace-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
