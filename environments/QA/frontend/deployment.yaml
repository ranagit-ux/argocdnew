apiVersion: apps/v1
kind: Deployment 
metadata:
  name: qa-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qa-frontend
  template:
    metadata:
      labels:
        app: qa-frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.27
          ports:
            - containerPort: 80
