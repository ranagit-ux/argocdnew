apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramukaka-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ramukaka-frontend
  template:
    metadata:
      labels:
        app: ramukaka-frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.27
          ports:
            - containerPort: 80
