apiVersion: apps/v1
kind: Deployment
metadata:
  name: first-dep
  namespace: gitops-demo

spec:
  replicas: 4

  selector:
    matchLabels:
      app: nginx

  # strategy:
  #   rollingUpdate:
  #     maxSurge: 50%
  #     maxUnavailable: 50%

  template:
    metadata:
      labels:
        app: nginx

    spec:
      restartPolicy: Always

      containers:
        - name: nginx-container
          image: nginx
          ports:
            - containerPort: 80
