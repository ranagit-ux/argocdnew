  apiVersion:	apps/v1
  kind: Deployment
  metadata:
    name:	first-dep
    namespace: gitops-demo
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: niginx
    strategy:
      rollingUpdate:
        maxSurge:	50%
        maxUnavailable:	50%
    revisionHistoryLimit: 2
    paused: false
    template:
      metadata:
        labels:
          app: niginx
        name:	dep-pod
        namespace:	gitops-demo
      spec:
 
        serviceAccountName:  rbacaccount
        restartPolicy: Always
        containers:
          - image: nginx
            imagePullPolicy: IfNotPresent
            name:	nginx-container
            command:
              - sh
              - -c
              - |
                mkdir -p /usr/share/nginx/html/rana
                echo "Welcome to Rana Application" > /usr/share/nginx/html/rana/index.html
                nginx -g "daemon off;"
